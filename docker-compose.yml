name: japan-travel

# Local dev infra only. Ports are offset from DoctorDesk (kame-desk)
# so both stacks can run on the same machine.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: japan-travel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: japan
      POSTGRES_PASSWORD: japan_local_only
      POSTGRES_DB: japan_travel
    ports:
      - "5433:5432"
    volumes:
      - japan-travel-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U japan -d japan_travel"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: japan-travel-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - japan-travel-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: japan-travel-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: japan
      MINIO_ROOT_PASSWORD: japan_local_only
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - japan-travel-minio-data:/data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: japan-travel-mailhog
    restart: unless-stopped
    ports:
      - "1026:1025"
      - "8026:8025"

volumes:
  japan-travel-postgres-data:
  japan-travel-redis-data:
  japan-travel-minio-data:
